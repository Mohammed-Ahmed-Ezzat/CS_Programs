<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>CS Programs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="alternate icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="apple-touch-icon" href="favicon.svg"/><style>
:root{--ink:#172b43;--muted:#667b91;--blue:#587795;--blue2:#e9eff5;--paper:#f7f9fc;--line:#dce5ed}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8edf2;color:var(--ink);font-family:Arial, sans-serif}
.poster{width:100%!important;min-height:100vh!important;margin:0;padding:46px 52px 54px;background:#91a5b8;display:flex;flex-direction:column;gap:30px}
.course-list{display:flex;flex-direction:column;gap:22px}.course-row{background:rgba(248,250,252,.35);border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:16px 18px 18px}
.course-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px;padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.65)}
.course-heading h2{font-size:20px!important;line-height:1.2!important;color:#fff!important;margin:0!important;letter-spacing:.01em}
.course-heading span{font:700 10px/1 Arial,sans-serif;letter-spacing:.13em;color:#f7fbff;white-space:nowrap}
.program-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.program-card{background:var(--paper);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 5px 15px rgba(31,52,73,.08)}
 .brandmark{width:100%;height:82px;display:flex;align-items:center;justify-content:flex-start;overflow:visible;padding:0;background:transparent;border:0;border-radius:0}
.brandmark img{display:block;max-width:210px;max-height:76px;width:auto;height:auto;object-fit:contain;object-position:left center;flex:0 0 auto}
.brandmark.square img{width:76px;height:76px;object-fit:contain}
.brandmark.wide img{max-width:210px;max-height:76px}
.brandmark.gnu img{width:112px;height:82px;max-width:112px;max-height:82px;object-fit:contain;object-position:left center}
.program-card h2{font-size:23px!important;line-height:1.12!important;color:#172b43!important;margin:0!important;overflow-wrap:anywhere}
.program-card>div:not(.brandmark):not([style]){color:#52677c}
.program-card>div:nth-of-type(2){font:700 13px/1.2 Arial,sans-serif;color:#52677c}
.program-card>div:nth-of-type(3){font:600 14px/1.35 Arial,sans-serif;color:#263d53}
.program-card .shared-course{font:600 12px/1.3 Arial,sans-serif;color:#60758a;background:#edf2f7;border-radius:7px;padding:6px 8px}
.program-card a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:0 13px;border-radius:9px;background:var(--blue);color:#fff;text-decoration:none;font:600 13px/1 Arial,sans-serif;margin-top:7px}
.program-card a:nth-last-child(1):not(:first-child){background:#e9eff5;color:#405970}
.program-card a:hover{filter:brightness(.96)}
@media(min-width:850px){.course-row:has(.program-card:only-child) .program-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:650px){.poster{padding:26px 18px;gap:22px}.program-grid{grid-template-columns:1fr}.course-row{padding:13px}.course-heading h2{font-size:18px!important}}

.personal-logo{display:block;width:260px;height:auto;max-height:82px;object-fit:contain;border-radius:0;box-shadow:none}
.poster-topline{min-height:82px}
.course-row{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.34)!important;box-shadow:0 14px 34px rgba(12,20,90,.12)}
.course-row:nth-child(1){background:rgba(255,255,255,.17)!important}
.course-row:nth-child(2){background:rgba(255,255,255,.13)!important}
.course-row:nth-child(3){background:rgba(255,255,255,.18)!important}
.course-row:nth-child(4){background:rgba(255,255,255,.13)!important}
.course-row:nth-child(5){background:rgba(255,255,255,.17)!important}
.program-card{background:linear-gradient(145deg,#ffffff 0%,#f2f6ff 100%)!important;border:1px solid rgba(255,255,255,.92)!important;box-shadow:0 10px 24px rgba(12,20,90,.14)!important;transition:transform .2s ease,box-shadow .2s ease}
.program-card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(12,20,90,.2)!important}
.program-card a{background:linear-gradient(90deg,#3155ed,#6848e8)!important;color:#fff!important}
.program-card a:nth-last-child(1):not(:first-child){background:#e8edff!important;color:#3448b8!important}
.course-heading{border-bottom-color:rgba(255,255,255,.48)!important}
.course-heading h2{ text-shadow:0 2px 12px rgba(13,25,90,.18)}
.brandmark{height:90px!important}
.brandmark img{max-height:82px!important}
@media(max-width:650px){.poster-topline{align-items:flex-start!important;flex-direction:column!important}.personal-logo{width:220px}}
</style>
<style>
  body {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;

    ) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });

  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet"/>
<style>
.hero{position:relative;overflow:hidden;border-radius:28px;padding:34px 40px 42px;display:flex;flex-direction:column;gap:26px;color:#fff;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:radial-gradient(800px 380px at 100% 0%,rgba(113,63,231,.55),transparent 60%),radial-gradient(500px 300px at 0% 100%,rgba(49,85,237,.25),transparent 70%),linear-gradient(120deg,#0a1020 0%,#141a3d 55%,#2a2a6a 100%);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px rgba(8,12,60,.38)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;font:700 25px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em}
.brand svg{width:54px;height:54px;flex:none}.brand i{font-style:normal;color:#ff7a45}
.hero-stat{font:700 15px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:#e8ecff;opacity:.85}
.hero h1{margin:0;font:800 clamp(56px,13.5vw,150px)/.9 'Bricolage Grotesque',sans-serif;letter-spacing:-.035em;color:#fff}
.hero p{margin:0;max-width:700px;font:500 22px/1.4 'Bricolage Grotesque',sans-serif;color:rgba(255,255,255,.82)}
.bot-banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:22px;text-decoration:none;color:#fff;background:linear-gradient(100deg,#0f1b3d 0%,#16306b 55%,#1f7fd0 100%);border:1px solid rgba(255,255,255,.24);box-shadow:0 14px 34px rgba(12,20,90,.28),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .2s ease,box-shadow .2s ease}
.bot-banner:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(12,20,90,.38),inset 0 1px 0 rgba(255,255,255,.2)}
.bot-icon{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#37aee2,#1e96c8);box-shadow:0 0 0 6px rgba(55,174,226,.22);animation:botpulse 2.6s ease-out infinite}
@keyframes botpulse{0%{box-shadow:0 0 0 0 rgba(55,174,226,.55)}100%{box-shadow:0 0 0 16px rgba(55,174,226,0)}}
.bot-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bot-text b{font:800 22px/1.15 'Bricolage Grotesque',sans-serif}.bot-text small{font:500 14px/1.35 Arial,sans-serif;opacity:.82}
.bot-cta{flex:none;background:#fff;color:#0f1b3d;font:700 14px/1 Arial,sans-serif;padding:13px 18px;border-radius:12px;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.bot-icon{animation:none}}
@media(max-width:650px){.hero{padding:24px 20px 28px;border-radius:22px}.hero p{font-size:16px}.bot-banner{flex-wrap:wrap;padding:16px}.bot-cta{width:100%;text-align:center}.bot-text b{font-size:19px}}
</style>
<style id="calm-palette">
html,body{background:#0e1526}
.poster{background:linear-gradient(160deg,#0e1526 0%,#141d36 55%,#1a2444 100%)!important}
.hero{background:radial-gradient(760px 360px at 100% 0%,rgba(110,95,200,.32),transparent 62%),radial-gradient(520px 300px at 0% 100%,rgba(70,110,200,.16),transparent 70%),linear-gradient(120deg,#111a33 0%,#18214a 60%,#232a5c 100%);border-color:rgba(255,255,255,.08);box-shadow:0 18px 44px rgba(0,0,0,.35)}
.hero-stat{color:#c9d3ee}.hero p{color:rgba(226,232,248,.78)}
.course-list .course-row,.course-list .course-row:nth-child(n){background:rgba(255,255,255,.045)!important;border:1px solid rgba(255,255,255,.1)!important;box-shadow:none!important}
.course-heading{border-bottom-color:rgba(255,255,255,.13)!important}
.course-heading h2{color:#e8edf8!important;text-shadow:none!important}
.course-heading span{color:#9fb0d3}
.program-card{background:linear-gradient(145deg,#f1f4f9 0%,#e5eaf3 100%)!important;border:1px solid rgba(255,255,255,.55)!important;box-shadow:0 8px 20px rgba(0,0,0,.22)!important}
.program-card:hover{box-shadow:0 14px 28px rgba(0,0,0,.3)!important}
.program-card a{background:linear-gradient(90deg,#4a63c4,#5963c0)!important;color:#fff!important}
.program-card a:nth-last-child(1):not(:first-child){background:#d9e1f1!important;color:#33447a!important}
.bot-banner{background:linear-gradient(100deg,#13243f 0%,#17406a 55%,#1d6a97 100%);border-color:rgba(255,255,255,.16);box-shadow:0 12px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12)}
.bot-icon{background:linear-gradient(145deg,#4aa8d6,#2f8bb8)}
.bot-cta{background:#eaf1fa;color:#13243f}
</style>
<style id="flow-layout">
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
::selection{background:rgba(120,140,230,.35)}
.poster{background:radial-gradient(900px 520px at 88% -4%,rgba(110,95,200,.26),transparent 62%),radial-gradient(700px 520px at 0% 38%,rgba(70,110,200,.11),transparent 70%),linear-gradient(160deg,#0e1526 0%,#141d36 55%,#1a2444 100%)!important}
.hero{background:none;border:0;border-radius:0;box-shadow:none;padding:6px 0 10px;overflow:visible;gap:24px}
.hero::after{content:"";display:block;height:1px;margin-top:14px;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 70%,transparent)}
.program-card a:focus-visible,.bot-banner:focus-visible{outline:3px solid #9db4ff;outline-offset:3px}
@media(min-width:651px){
.course-row:has(.program-card:only-child) .program-grid{grid-template-columns:minmax(0,1fr)}
.program-card:only-child{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:22px;row-gap:2px;align-items:center;padding:18px 24px}
.program-card:only-child>div:nth-child(1){grid-column:1;grid-row:1/3}
.program-card:only-child>h2{grid-column:2;grid-row:1;align-self:end}
.program-card:only-child>div:nth-child(3){grid-column:2;grid-row:2;align-self:start}
.program-card:only-child>div:nth-child(4){grid-column:3;grid-row:1/3;display:flex;gap:10px}
.program-card:only-child a{margin-top:0;white-space:nowrap}
}
@media(max-width:650px){.hero{padding:0 0 6px}}
</style>
<style id="tg-palette">
.bot-banner{background:linear-gradient(100deg,#18214a 0%,#222d6a 55%,#2e3b88 100%)!important;border-color:rgba(255,255,255,.14)!important;box-shadow:0 12px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1)!important}
.bot-icon{background:linear-gradient(145deg,#52aee0,#3a93c8)!important}
.bot-text small{opacity:.78}
.bot-cta{background:#e6ebfa!important;color:#1c2552!important}
</style>
<style id="responsive-fix">
html,body{overflow-x:hidden}
.brandmark img{mix-blend-mode:multiply}
.poster{padding:56px!important}
.hero,.bot-banner,.course-row,.program-card{min-width:0}
@media(max-width:900px){.poster{padding:36px 26px!important;gap:28px!important}.hero h1{font-size:clamp(46px,13vw,110px)}}
@media(max-width:650px){
.poster{padding:22px 16px!important;gap:22px!important}
.hero{gap:18px}.hero h1{font-size:clamp(40px,12.4vw,72px)}.hero p{font-size:15px}
.brand{font-size:21px}.brand svg{width:44px;height:44px}.hero-stat{font-size:12px}
.course-row{padding:12px!important}.course-heading h2{font-size:17px!important}.course-heading span{font-size:9px}
.program-card{padding:15px!important}.program-card h2{font-size:21px!important}
.bot-text b{font-size:18px}.bot-text small{font-size:13px}
}
@media(max-width:380px){.hero-stat{letter-spacing:.04em}.program-card a{font-size:12px;padding:0 11px}}
</style>
<style id="responsive-fix-2">
.program-card h2{overflow-wrap:break-word!important;word-break:normal!important}
.program-card a span:first-child{min-width:0;overflow-wrap:anywhere}
.course-row>a{min-width:0;overflow-wrap:anywhere}
@media(min-width:651px) and (max-width:859px){
.program-card:only-child{display:flex!important;flex-direction:column;align-items:stretch;padding:18px!important}
.program-card:only-child>*{align-self:stretch!important;grid-column:auto!important;grid-row:auto!important}
.program-card:only-child>div:nth-child(4){flex-wrap:wrap}
.program-card:only-child>div:nth-child(4) a{flex:1 1 150px}
}
@media(max-width:380px){.course-row>a{padding:0 14px!important;font-size:12px!important}}
</style>
</head>
